<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#181A1F">
<title>SinalizAI · Frases e Alfabeto em Libras</title>
<style>
  :root {
    --charcoal: #181A1F;
    --concrete: #22252C;
    --border: #323640;
    --offwhite: #F3F4F6;
    --muted: #9AA0AD;
    --emerald: #10B981;
    --indigo: #4F46E5;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    background: var(--charcoal);
    color: var(--offwhite);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    min-height: 100vh;
    /* espaço para a barra fixa de baixo */
    padding-bottom: calc(84px + var(--safe-b));
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

  header { padding: 22px 0 14px; }
  .logo {
    font-size: clamp(2.3rem, 12vw, 3.6rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .logo span { color: var(--emerald); }
  .tagline { margin-top: 8px; color: var(--muted); font-size: 0.95rem; }

  .layout { display: grid; grid-template-columns: 1fr; gap: 26px; align-items: start; }

  .col-title {
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 10px;
  }
  .col-title b { color: var(--emerald); }

  /* Frases: cada uma é um botão grande, fácil de tocar */
  .phrases { list-style: none; display: grid; gap: 10px; }
  .phrase {
    appearance: none; width: 100%; text-align: left; font: inherit; color: inherit;
    display: flex; align-items: center; gap: 14px;
    background: var(--concrete);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    min-height: 64px;
    cursor: pointer;
    touch-action: manipulation;
    transition: border-color .15s, background .15s;
  }
  .phrase:active { transform: scale(.99); }
  .num {
    flex: none;
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(79, 70, 229, .22);
    color: #B9B5FF;
    font-weight: 800; font-size: 1rem;
  }
  .text {
    font-size: clamp(1.25rem, 5.8vw, 1.6rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }
  .phrase[aria-pressed="true"] {
    border-color: var(--emerald);
    background: rgba(16, 185, 129, .1);
  }
  .phrase[aria-pressed="true"] .num { background: var(--emerald); color: #06261c; }

  /* Alfabeto */
  .alpha-card {
    background: var(--concrete);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px;
  }
  .zoom {
    display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in;
    border-radius: 12px; overflow: hidden; touch-action: manipulation;
  }
  .zoom img { display: block; width: 100%; height: auto; }
  .btn-zoom {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 700;
    width: 100%; margin-top: 8px; min-height: 52px; border-radius: 12px;
    background: var(--indigo); color: #fff; font-size: 1rem;
    touch-action: manipulation;
  }
  .caption { color: var(--muted); font-size: 0.85rem; text-align: center; margin: 10px 4px 4px; }

  /* Barra fixa de baixo (celular) */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(24, 26, 31, .96);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border-top: 1px solid var(--border);
    padding: 10px 14px calc(10px + var(--safe-b));
  }
  .bar-in { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .bar-info { flex: 1; min-width: 0; }
  .bar-label { font-size: 0.7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .bar-phrase {
    font-size: 1.05rem; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bar-phrase.empty { color: var(--muted); font-weight: 500; }
  .bar-btn {
    flex: none; appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 800;
    min-height: 48px; padding: 0 18px; border-radius: 12px;
    background: var(--emerald); color: #06261c; font-size: 1rem;
    touch-action: manipulation;
  }

  /* Imagem ampliada */
  .lightbox {
    position: fixed; inset: 0; z-index: 30;
    background: #0B0C0F;
    display: none; flex-direction: column;
    height: 100vh; height: 100dvh;
  }
  .lightbox.open { display: flex; }
  .lb-bar {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 10px 14px; color: var(--muted); font-size: 0.9rem;
    border-bottom: 1px solid var(--border);
  }
  .lb-close {
    appearance: none; border: 0; background: var(--emerald); color: #06261c;
    font: inherit; font-weight: 800; min-height: 44px; padding: 0 20px;
    border-radius: 12px; cursor: pointer;
  }
  .lb-scroll {
    flex: 1; overflow: auto; -webkit-overflow-scrolling: touch;
    touch-action: pan-x pan-y pinch-zoom;
    padding: 12px;
  }
  .lb-scroll img { display: block; width: 780px; max-width: none; height: auto; }

  footer { margin: 30px 0 8px; text-align: center; color: var(--muted); font-size: 0.8rem; }
  footer b { color: var(--offwhite); }
  footer b i { font-style: normal; color: var(--emerald); }

  /* Telas largas: frases à esquerda, alfabeto à direita */
  @media (min-width: 900px) {
    .wrap { padding: 0 24px; }
    .layout { grid-template-columns: minmax(300px, 0.8fr) minmax(0, 1.4fr); gap: 28px; }
    .col-alfabeto { position: sticky; top: 20px; }
    .bar { display: none; }
    body { padding-bottom: 32px; }
    .lb-scroll img { width: min(1200px, 100%); }
  }
  @media (max-width: 899px) {
    .phrase:focus-visible, .zoom:focus-visible, .bar-btn:focus-visible { outline: 3px solid var(--indigo); outline-offset: 2px; }
  }
</style>
</head>

<!-- Barra fixa (celular) -->
<div class="bar" id="bar">
  <div class="bar-in">
    <div class="bar-info">
      <div class="bar-label">Sua frase</div>
      <div class="bar-phrase empty" id="bar-phrase">Toque numa frase acima</div>
    </div>
    <button class="bar-btn" id="bar-btn">Alfabeto ↓</button>
  </div>
</div>

<!-- Imagem ampliada -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Alfabeto em Libras ampliado">
  <div class="lb-bar">
    <span id="lb-phrase">Arraste ou use dois dedos para dar zoom</span>
    <button class="lb-close" id="close-zoom">Fechar</button>
  </div>
  <div class="lb-scroll">
    <img id="lb-img" alt="Alfabeto em Libras ampliado">
  </div>
</div>

<script>
  const phraseBtns = document.querySelectorAll('.phrase');
  const barPhrase = document.getElementById('bar-phrase');
  const lbPhrase = document.getElementById('lb-phrase');
  const lbHint = lbPhrase.textContent;
  const barBtn = document.getElementById('bar-btn');
  const secFrases = document.getElementById('sec-frases');
  const secAlfabeto = document.getElementById('sec-alfabeto');

  // Selecionar frase
  phraseBtns.forEach(btn => btn.addEventListener('click', () => {
    const already = btn.getAttribute('aria-pressed') === 'true';
    phraseBtns.forEach(b => b.setAttribute('aria-pressed', 'false'));
    if (already) {
      barPhrase.textContent = 'Toque numa frase acima';
      barPhrase.classList.add('empty');
      lbPhrase.textContent = lbHint;
    } else {
      btn.setAttribute('aria-pressed', 'true');
      barPhrase.textContent = btn.dataset.text;
      barPhrase.classList.remove('empty');
      lbPhrase.textContent = btn.dataset.text;
    }
  }));

  // Botão da barra: alterna entre alfabeto e frases
  let alphabetVisible = false;
  new IntersectionObserver(entries => {
    alphabetVisible = entries[0].isIntersecting;
    barBtn.textContent = alphabetVisible ? '↑ Frases' : 'Alfabeto ↓';
  }, { threshold: 0.35 }).observe(secAlfabeto);

  barBtn.addEventListener('click', () => {
    (alphabetVisible ? secFrases : secAlfabeto).scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // Imagem ampliada
  const lb = document.getElementById('lightbox');
  function openZoom() {
    document.getElementById('lb-img').src = document.getElementById('alpha-img').src;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeZoom() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
  }
  document.getElementById('open-zoom').addEventListener('click', openZoom);
  document.getElementById('open-zoom-2').addEventListener('click', openZoom);
  document.getElementById('close-zoom').addEventListener('click', closeZoom);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeZoom(); });
</script>
